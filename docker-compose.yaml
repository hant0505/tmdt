services:

  php:
    build: .
    container_name: magento_php
    volumes:
      - ./magento:/var/www/html
    working_dir: /var/www/html
    environment:
      SMTP_MODE: ${SMTP_MODE:-mailpit}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@localhost}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_AUTH: ${SMTP_AUTH:-off}
      SMTP_TLS: ${SMTP_TLS:-off}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-off}
    depends_on:
      - mailpit

  nginx:
    image: nginx:1.24
    container_name: magento_nginx
    ports:
      - "80:80"
      - "443:443" #https
    volumes:
      - ./magento:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8
    container_name: magento_mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Stron#HTnsngMagentoPassword#2026"
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: "StrongMagen#HantoPassword#2026"
    volumes: #bind mount
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: magento_redis

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: magento_os
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Magento123!@#  # <--- THÊM DÒNG NÀY
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    #ports:
    #  - "9200:9200"
    #  - "9600:9600"

  mailpit:
    image: axllent/mailpit:latest
    container_name: magento_mailpit
    ports:
      # - "1025:1025" nội bộ chưa cần expose internet
      - "8025:8025"

volumes:
  mysql_data:

<div class="tekntek-minicart-content">
    <!-- Items list -->
    <!-- ko if: getCartParam('summary_count') -->
    <div data-action="scroll" class="tekntek-minicart-items-wrapper">
        <ol id="mini-cart" class="tekntek-minicart-items" data-bind="foreach: { data: getCartItems(), as: 'item' }">
            <each args="$parent.getRegion($parent.getItemRenderer(item.product_type))"
                  render="{name: getTemplate(), data: item, afterRender: function() {
                      var parent = $parents[1] || $parents[0];
                      if (parent && typeof parent.initSidebar === 'function') {
                          parent.initSidebar();
                      }
                  }}"></each>
        </ol>
    </div>

    <!-- Totals section - always show when items exist -->
    <div class="tekntek-minicart-totals">
        <div class="tekntek-minicart-totals__row total">
            <span class="label">Subtotal</span>
            <span class="value" data-bind="html: getCartParamUnsanitizedHtml('subtotal')"></span>
        </div>
    </div>
    <!-- /ko -->

    <!-- Empty state message -->
    <!-- ko ifnot: getCartParam('summary_count') -->
    <strong class="tekntek-minicart-empty">Gio hang trong.</strong>
    <!-- /ko -->

    <!-- Buttons - Always visible -->
    <div class="tekntek-minicart-actions">
        <a class="action review-items" data-bind="attr: {href: shoppingCartUrl}">
            <span>Review items</span>
        </a>
        <a class="action checkout" data-bind="attr: {href: checkoutUrl}">
            <span>Checkout</span>
        </a>
    </div>
</div>

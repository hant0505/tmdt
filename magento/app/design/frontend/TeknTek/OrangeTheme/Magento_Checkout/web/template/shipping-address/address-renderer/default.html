<div class="shipping-address-item tekntek-shipping-address-item"
     css="'selected-item': isSelected(), 'not-selected-item': !isSelected()"
     click="function () { if (!isSelected()) { selectAddress(); } }">
    <button visible="address().isEditable()"
            type="button"
            class="action edit-address-link"
            click="function (data, event) { if (event && event.stopPropagation) { event.stopPropagation(); } editAddress(); }"
            title="Edit address">
        <span translate="'Edit'"></span>
    </button>

    <div class="tekntek-shipping-address-item__content">
        <text args="address().prefix"></text> <text args="address().firstname"></text> <text args="address().middlename"></text>
        <text args="address().lastname"></text> <text args="address().suffix"></text><br>
        <if args="address().company">
            <text args="address().company"></text><br>
        </if>
        <text args="(function () { var street = address().street || [], lines = _.isArray(street) ? street : _.values(street); var pick = function (line) { if (!line) { return ''; } if (_.isObject(line)) { return (line.value || line.label || line.text || line.street || line.name || '').toString().trim(); } return (line || '').toString().trim(); }; return _.compact(_.map(lines, pick)).join(', '); })()" ></text><br>
        <text args="(function () { var city = (address().city || '').toString().trim(), region = (address().region || '').toString().trim(), postcode = (address().postcode || '').toString().trim(), parts = []; if (city) { parts.push(city); } if (region && region.toLowerCase() !== city.toLowerCase()) { parts.push(region); } if (postcode) { parts.push(postcode); } return parts.join(', '); })()"></text><br>
        <text args="getCountryName(address().countryId)"></text><br>
        <if args="address().telephone">
            <a attr="'href': 'tel:' + address().telephone" text="address().telephone"></a><br>
        </if>
        <if args="address().vatId">
            <translate args="'VAT'"></translate>: <text args="address().vatId"></text><br>
        </if>
    </div>

    <!-- ko if: (!isSelected()) -->
    <button type="button" click="selectAddress" class="action action-select-shipping-item">
        <span translate="'Ship Here'"></span>
    </button>
    <!-- /ko -->
</div>

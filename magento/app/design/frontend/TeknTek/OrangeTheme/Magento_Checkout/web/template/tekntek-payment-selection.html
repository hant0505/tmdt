<!--
/**
 * Custom Payment Selection displayed in payment step (left column)
 */
-->
<div class="tekntek-payment-selection-wrapper tekntek-payment-wrapper">
    <div class="tekntek-payment-header">
        <h3 class="tekntek-payment-title">Payment Method</h3>
        <p class="tekntek-payment-subtitle">Select the payment method that works best for you</p>
    </div>

    <div class="tekntek-payment-options-wrapper">
        <label class="tekntek-payment-option-card">
            <input type="radio" name="payment_method_selection" value="vnpay"
                   class="payment-method-radio" data-bind="checked: selectedMethod">
            <div class="payment-option-content">
                <span class="payment-option-title">VNPay</span>
                <span class="payment-option-desc">Pay securely via VNPay gateway</span>
            </div>
        </label>

        <label class="tekntek-payment-option-card">
            <input type="radio" name="payment_method_selection" value="cashondelivery"
                   class="payment-method-radio" data-bind="checked: selectedMethod">
            <div class="payment-option-content">
                <span class="payment-option-title">Cash On Delivery (COD)</span>
                <span class="payment-option-desc">Pay when you receive your order</span>
            </div>
        </label>
    </div>

    <div class="payment-details-section" data-bind="visible: isVnpay()">
        <h4 class="details-title">VNPay Information</h4>
        <div class="details-content">
            <div class="form-group">
                <label for="bank_select">Select Issuing Bank</label>
                <select id="bank_select" name="bank_select" class="form-control">
                    <option value="">-- Choose a bank --</option>
                    <option value="vietcombank">Vietcombank (VCB)</option>
                    <option value="techcombank">Techcombank (TCB)</option>
                    <option value="agribank">Agribank</option>
                    <option value="bidv">BIDV</option>
                    <option value="sacombank">Sacombank</option>
                    <option value="mbbank">MB Bank</option>
                    <option value="vpbank">VPBank</option>
                    <option value="eximbk">Exim Bank</option>
                </select>
            </div>

            <div class="form-group">
                <label for="account_number">Account Number</label>
                <input type="text" id="account_number" name="account_number" class="form-control"
                       placeholder="e.g., 123456789">
            </div>

            <div class="form-group">
                <label for="account_holder">Account Holder Name</label>
                <input type="text" id="account_holder" name="account_holder" class="form-control"
                       placeholder="Your full name">
            </div>

            <div class="transfer-info-box">
                <p class="info-label">VNPay Checkout:</p>
                <p class="info-amount">Amount: <strong>--</strong></p>
                <p class="info-text">You will be redirected to VNPay after placing the order.</p>
            </div>
        </div>
    </div>

    <div class="payment-details-section" data-bind="visible: isCashOnDelivery()">
        <div class="cod-info-box">
            <p>You will pay in cash when your order is delivered.</p>
            <p>Please have the exact change ready.</p>
        </div>
    </div>
</div>
